<!DOCTYPE html>
<html lang="en">
<head>

  <title>Bot Pro</title>

  <link rel="stylesheet" href="style.css">

  <!-- Icons -->

</head>

<body>

  <div class="logo">

type="text"
placeholder="Search videos, users, AI...">

<div>

home

</div>

<span class="material-icons">
smart_display

</div>
