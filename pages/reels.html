<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Bot Pro - Reels

    </title>

    <link rel="stylesheet"
          href="../css/reels.css">

</head>

<body>

<section class="reels-container">

    <div class="top-bar">

        <h2>

            Reels

        </h2>

        <div class="top-tabs">

            <button>

                Following

            </button>

            <button class="active">

                For You

            </button>

        </div>

        <button class="camera-btn">

            <svg class="top-icon"
                 viewBox="0 0 24 24">

                <path d="M7 6H9L10.5 4H13.5L15 6H17C18.1 6 19 6.9 19 8V18C19 19.1 18.1 20 17 20H7C5.9 20 5 19.1 5 18V8C5 6.9 5.9 6 7 6ZM12 9A4 4 0 1 0 12 17A4 4 0 0 0 12 9Z"
                      fill="currentColor"/>

            </svg>

        </button>

    </div>

    <div class="reel-card">

        <div class="video-placeholder">

            REEL VIDEO

        </div>

        <div class="right-actions">

            <div class="creator">

                <div class="creator-avatar">

                    BP

                </div>

                <button class="follow-btn">

                    +

                </button>

            </div>

            <button class="action-btn">

                <svg class="action-icon"
                     viewBox="0 0 24 24">

                    <path d="M12 21C12 21 4 16 4 9.5C4 6.4 6.4 4 9.5 4C11.3 4 12 5 12 5C12 5 12.7 4 14.5 4C17.6 4 20 6.4 20 9.5C20 16 12 21 12 21Z"
                          fill="currentColor"/>

                </svg>

                <span>

                    12.4K

                </span>

            </button>

            <button class="action-btn">

                <svg class="action-icon"
                     viewBox="0 0 24 24">

                    <path d="M4 4H20V16H6L4 18V4Z"
                          fill="currentColor"/>

                </svg>

                <span>

                    356

                </span>

            </button>
            <button class="action-btn">

                <svg class="action-icon"
                     viewBox="0 0 24 24">

                    <path d="M4 12L20 4L16 20L11 13L4 12Z"
                          fill="currentColor"/>

                </svg>

                <span>

                    1.2K

                </span>

            </button>

            <button class="action-btn">

                <svg class="action-icon"
                     viewBox="0 0 24 24">

                    <path d="M6 3H18V21L12 17L6 21V3Z"
                          fill="currentColor"/>

                </svg>

                <span>

                    Save

                </span>

            </button>

            <button class="action-btn">

                <svg class="action-icon"
                     viewBox="0 0 24 24">

                    <circle cx="12"
                            cy="5"
                            r="2"
                            fill="currentColor"/>

                    <circle cx="12"
                            cy="12"
                            r="2"
                            fill="currentColor"/>

                    <circle cx="12"
                            cy="19"
                            r="2"
                            fill="currentColor"/>

                </svg>

            </button>

        </div>

        <div class="reel-info">

            <div class="creator-row">

                <span class="creator-name">

                    @botpro_official

                </span>

                <button class="follow">

                    Follow

                </button>

            </div>

            <p class="caption">

                Sometimes silence speaks louder than words.
                Just you, nature and peace.

            </p>

            <div class="hashtags">

                #sunset
                #nature
                #peace
                #botpro

            </div>

            <div class="audio-info">

                <svg class="audio-icon"
                     viewBox="0 0 24 24">

                    <path d="M9 18V6L19 4V16"
                          stroke="currentColor"
                          stroke-width="2"
                          fill="none"/>

                    <circle cx="7"
                            cy="18"
                            r="2"
                            fill="currentColor"/>

                    <circle cx="17"
                            cy="16"
                            r="2"
                            fill="currentColor"/>

                </svg>

                <span>

                    Original Audio • Bot Pro

                </span>

            </div>

        </div>

    </div>

</section>

<nav class="bottom-nav">

        </svg>

        <span>

    <a href="profile.html">

                  fill="currentColor"/>

</nav>
