<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOT PRO - Home</title>

<link rel="stylesheet" href="../css/home.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<header class="header">

    <div class="logo">

        <span class="bot">BOT</span>

        <span class="pro">PRO</span>

    </div>

    <div class="header-icons">

        <span class="material-icons">
            chat
        </span>

        <span class="material-icons">
            notifications
        </span>

    </div>

</header>

<div class="search-ai">

    <div class="search-box">

        <span class="material-icons">
            search
        </span>

        <input
            type="text"
            placeholder="Search videos, users, AI...">

    </div>

    <button class="ai-btn">

        AI

    </button>

</div>

<div class="categories">

    <button class="active">For You</button>

    <button>Trending</button>

    <button>Gaming</button>

    <button>Movies</button>

    <button>Music</button>

    <button>AI</button>

    <button>News</button>

    <button>Sports</button>

</div>

<div class="feed">

    <div class="video-card">

        <div class="thumbnail">

            VIDEO

            <div class="duration">

                10:25

            </div>

        </div>

        <div class="video-info">

            <h3>

                Welcome to BOT PRO

            </h3>

            <p>

                Official BOT PRO Channel • 1.2K Views

            </p>

        </div>

    </div>
