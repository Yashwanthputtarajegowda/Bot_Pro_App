<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT PRO - Home</title>

    <link rel="stylesheet" href="../css/home.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            BOT PRO
        </div>

        <div class="header-icons">

            <span class="material-icons" id="uploadBtn">
                add_circle
            </span>

            <span class="material-icons" id="notificationBtn">
                notifications
            </span>

        </div>

    </header>

    <!-- SEARCH + AI -->

    <section class="search-ai">

        <div class="search-box">

            <span class="material-icons">
                search
            </span>

            <input
                type="text"
                placeholder="Search videos, reels, users...">

        </div>

        <button class="ai-btn">

            🤖 AI Assistant

        </button>

    </section>

    <!-- CATEGORY -->

    <section class="categories">

        <button class="active">For You</button>

        <button>Trending</button>

        <button>Gaming</button>

        <button>Movies</button>

        <button>Music</button>

        <button>AI</button>

        <button>News</button>

        <button>Sports</button>

    </section>

    <!-- FEED -->

    <main class="feed">

        <div class="video-card">

            <div class="thumbnail">

                <span class="duration">
                    12:35
                </span>

            </div>

            <div class="video-info">

                <h3>
                    Welcome to BOT PRO
                </h3>

                <p>
                    Official Channel • 10K Views
                </p>

            </div>

        </div>

        <div class="video-card">

            <div class="thumbnail">

                <span class="duration">
                    18:42
                </span>

            </div>

            <div class="video-info">

                <h3>
                    Trending Videos
                </h3>

                <p>
                    Trending • 52K Views
                </p>

            </div>

        </div>

        <div class="video-card">

            <div class="thumbnail">

                <span class="duration">
                    08:10
                </span>

            </div>

            <div class="video-info">

                <h3>
                    Gaming Videos
                </h3>

                <p>
                    Gaming • 7.5K Views
                </p>

            </div>

        </div>

    </main>

    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a href="home.html" class="active">

            <span class="material-icons">
                home
            </span>

            <p>
                Home
            </p>

        </a>

        <a href="message.html">

            <span class="material-icons">
                chat
            </span>

            <p>
                Message
            </p>

        </a>

        <a href="reels.html">

            <span class="material-icons">
                smart_display
            </span>

            <p>
                Reels
            </p>

        </a>

        <a href="profile.html">

            <span class="material-icons">
                person
            </span>

            <p>
                Profile
            </p>

        </a>

    </nav>

    <script src="../js/script.js"></script>

</body>

</html>
