<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bot Pro</title>

    <link rel="stylesheet"
          href="../css/home.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="logo">

        <span class="bot">
            Bot
        </span>

        <span class="pro">
            Pro
        </span>

    </div>


    <div class="header-actions">

        <button
            id="uploadBtn"
            class="header-btn">

            <svg
                class="icon"
                viewBox="0 0 24 24">

                <path
                    d="M12 5V19M5 12H19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </button>


        <button
            id="notificationBtn"
            class="header-btn">

            <svg
                class="icon"
                viewBox="0 0 24 24">

                <path
                    d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22ZM18 16V11A6 6 0 1 0 6 11V16L4 18V19H20V18Z"
                    fill="currentColor"/>

            </svg>

        </button>

    </div>

</header>



<!-- =========================================
     SEARCH
========================================= -->

<section class="search-section">

    <div class="search-box">

        <svg
            class="icon"
            viewBox="0 0 24 24">

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2"
                fill="none"/>

            <line
                x1="16.5"
                y1="16.5"
                x2="21"
                y2="21"
                stroke="currentColor"
                stroke-width="2"/>

        </svg>


        <input
            type="text"
            id="searchInput"
            placeholder="Search videos, creators, AI...">

    </div>


    <button
        class="ai-btn">

        AI

    </button>

</section>



<!-- =========================================
     CATEGORIES
========================================= -->

<section class="category-section">

    <button class="category active">
        For You
    </button>

    <button class="category">
        Trending
    </button>

    <button class="category">
        Gaming
    </button>

    <button class="category">
        Movies
    </button>

    <button class="category">
        Music
    </button>

    <button class="category">
        AI
    </button>

    <button class="category">
        News
    </button>

    <button class="category">
        Sports
    </button>

</section>



<!-- =========================================
     HOME FEED
========================================= -->

<main class="feed">


    <div id="videoContainer">


        <!-- =================================
             Initial Demo Video Card
        ================================== -->

        <article
            class="video-card">


            <div class="thumbnail">

                <div
                    class="thumbnail-placeholder">

                    VIDEO

                </div>


                <span class="duration">

                    10:25

                </span>

            </div>


            <div class="video-details">


                <div class="channel-avatar">

                    BP

                </div>


                <div class="video-info">

                    <h3>

                        Welcome to Bot Pro

                    </h3>


                    <p>

                        Bot Pro Official • 1.2K Views • 2 Hours Ago

                    </p>

                </div>

            </div>


            <div class="video-actions">


                <!-- LIKE -->

                <button>

                    <svg
                        class="action-icon"
                        viewBox="0 0 24 24">

                        <path
                            d="M7 10V21H3V10H7ZM22 11C22 9.9 21.1 9 20 9H14.3L15.2 4.7V4.4C15.2 4 15 3.6 14.7 3.3L13.6 2L7.6 8C7.2 8.4 7 8.9 7 9.4V19C7 20.1 7.9 21 9 21H18C18.8 21 19.5 20.5 19.8 19.8L22 12.5V11Z"
                            fill="currentColor"/>

                    </svg>


                    <span>
                        Like
                    </span>

                </button>


                <!-- COMMENT -->

                <button>

                    <svg
                        class="action-icon"
                        viewBox="0 0 24 24">

                        <path
                            d="M4 4H20V16H6L4 18V4Z"
                            fill="currentColor"/>

                    </svg>


                    <span>
                        Comment
                    </span>

                </button>


                <!-- SHARE -->

                <button>

                    <svg
                        class="action-icon"
                        viewBox="0 0 24 24">

                        <path
                            d="M4 12L20 4L16 20L11 13L4 12Z"
                            fill="currentColor"/>

                    </svg>


                    <span>
                        Share
                    </span>

                </button>


                <!-- SAVE -->

                <button>

                    <svg
                        class="action-icon"
                        viewBox="0 0 24 24">

                        <path
                            d="M6 3H18V21L12 17L6 21V3Z"
                            fill="currentColor"/>

                    </svg>


                    <span>
                        Save
                    </span>

                </button>

            </div>

        </article>



        <!-- =================================
             Second Demo Video Card
        ================================== -->

        <article
            class="video-card">


            <div class="thumbnail">

                <div
                    class="thumbnail-placeholder">

                    VIDEO

                </div>


                <span class="duration">

                    08:42

                </span>

            </div>


            <div class="video-details">


                <div class="channel-avatar">

                    BP

                </div>


                <div class="video-info">

                    <h3>

                        Trending Videos

                    </h3>


                    <p>

                        Trending • 25K Views • Yesterday

                    </p>

                </div>

            </div>


        </article>


    </div>

</main>



<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">


    <!-- HOME -->

    <a
        href="home.html"
        class="active">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M3 11L12 3L21 11V21H14V14H10V21H3Z"
                fill="currentColor"/>

        </svg>


        <span>
            Home
        </span>

    </a>



    <!-- MESSAGES -->

    <a
        href="message.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M4 12L20 4L16 20L11 13L4 12Z"
                fill="currentColor"/>

        </svg>


        <span>
            Messages
        </span>

    </a>



    <!-- REELS -->

    <a
        href="reels.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M8 5H18V19H8V5ZM4 5H7V9H4V5ZM4 10H7V14H4V10ZM4 15H7V19H4V15Z"
                fill="currentColor"/>

        </svg>


        <span>
            Reels
        </span>

    </a>



    <!-- PROFILE -->

    <a
        href="profile.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M12 12A5 5 0 1 0 12 2A5 5 0 0 0 12 12ZM4 21C4 17.7 7.1 15 12 15C16.9 15 20 17.7 20 21Z"
                fill="currentColor"/>

        </svg>


        <span>
            Profile
        </span>

    </a>


</nav>



<!-- =========================================
     UPLOAD POPUP
========================================= -->

<div
    id="uploadMenu"
    class="upload-menu hidden">


    <button
        id="videoUpload">

        Upload Video

    </button>


    <button
        id="reelUpload">

        Upload Reel

    </button>


    <button
        id="photoUpload">

        Upload Photo

    </button>


    <button
        id="linkUpload">

        Import Link

    </button>


    <button
        id="aiCreate">

        AI Generate

    </button>


</div>



<!-- =========================================
     HOME JS
========================================= -->

<script
    type="module"
    src="../js/home.js">
</script>


</body>

</html>
