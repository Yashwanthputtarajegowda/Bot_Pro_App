<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bot Pro</title>

    <link rel="stylesheet"
          href="../css/home.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<header class="header">

    <div class="logo">

        <span class="bot">

            Bot

        </span>

        <span class="pro">

            Pro

        </span>

    </div>

    <div class="header-right">

        <button id="uploadBtn"
                class="icon-btn">

            ➕

        </button>

        <button id="notificationBtn"
                class="icon-btn">

            🔔

        </button>

    </div>

</header>

<section class="search-section">

    <div class="search-box">

        <span class="search-icon">

            🔍

        </span>

        <input type="text"
               id="searchInput"
               placeholder="Search videos, creators, AI...">

    </div>

    <button class="ai-btn">

        AI

    </button>

</section>

<section class="category-section">

    <button class="category active">

        For You

    </button>

    <button class="category">

        Trending

    </button>

    <button class="category">

        Gaming

    </button>

    <button class="category">

        Movies

    </button>

    <button class="category">

        Music

    </button>

    <button class="category">

        AI

    </button>

    <button class="category">

        News

    </button>

    <button class="category">

        Sports

    </button>

</section>

<main class="feed">

    <div id="videoContainer">
        <article class="video-card">

            <div class="thumbnail">

                <img src="../assets/demo-thumbnail.jpg"
                     alt="Video Thumbnail">

                <span class="duration">

                    10:25

                </span>

            </div>

            <div class="video-details">

                <div class="channel-image">

                    <img src="../assets/profile.png"
                         alt="Channel">

                </div>

                <div class="video-info">

                    <h3>

                        Welcome to Bot Pro

                    </h3>

                    <p>

                        Bot Pro Official • 1.2K Views • 2 Hours Ago

                    </p>

                </div>

            </div>

            <div class="video-actions">

                <button>

                    👍 Like

                </button>

                <button>

                    💬 Comment

                </button>

                <button>

                    ↗ Share

                </button>

                <button>

                    💾 Save

                </button>

            </div>

        </article>

        <article class="video-card">

            <div class="thumbnail">

                <img src="../assets/demo-thumbnail2.jpg"
                     alt="Video Thumbnail">

                <span class="duration">

                    08:42

                </span>

            </div>

            <div class="video-details">

                <div class="channel-image">

                    <img src="../assets/profile2.png"
                         alt="Channel">

                </div>

                <div class="video-info">

                    <h3>

                        Trending Videos

                    </h3>

                    <p>

                        Trending • 25K Views • Yesterday

                    </p>

                </div>

            </div>

            <div class="video-actions">

                <button>

                    👍 Like

                </button>

                <button>

                    💬 Comment

                </button>

                <button>

                    ↗ Share

                </button>

                <button>

                    💾 Save

                </button>

            </div>

        </article>

    </div>

</main>

<nav class="bottom-nav">

    <a href="home.html"
       class="active">

        🏠

        <span>

            Home

        </span>

    </a>

    <a href="message.html">

        💬

        <span>

            Chat

        </span>

    </a>
