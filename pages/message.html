<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Bot Pro - Messages

    </title>

    <link rel="stylesheet"
          href="../css/message.css">

</head>

<body>

<header class="header">

    <button class="menu-btn">

        <svg class="header-icon"
             viewBox="0 0 24 24">

            <path d="M3 6H21M3 12H21M3 18H21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"/>

        </svg>

    </button>

    <h1>

        Messages

    </h1>

    <div class="header-right">

        <button class="header-btn">

            <svg class="header-icon"
                 viewBox="0 0 24 24">

                <circle cx="11"
                        cy="11"
                        r="7"
                        stroke="currentColor"
                        stroke-width="2"
                        fill="none"/>

                <line x1="16.5"
                      y1="16.5"
                      x2="21"
                      y2="21"
                      stroke="currentColor"
                      stroke-width="2"/>

            </svg>

        </button>

        <button class="header-btn">

            <svg class="header-icon"
                 viewBox="0 0 24 24">

                <circle cx="12"
                        cy="5"
                        r="2"
                        fill="currentColor"/>

                <circle cx="12"
                        cy="12"
                        r="2"
                        fill="currentColor"/>

                <circle cx="12"
                        cy="19"
                        r="2"
                        fill="currentColor"/>

            </svg>

        </button>

    </div>

</header>

<section class="search-section">

    <div class="search-box">

        <svg class="search-icon"
             viewBox="0 0 24 24">

            <circle cx="11"
                    cy="11"
                    r="7"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"/>

            <line x1="16.5"
                  y1="16.5"
                  x2="21"
                  y2="21"
                  stroke="currentColor"
                  stroke-width="2"/>

        </svg>

        <input
            type="text"
            placeholder="Search messages..."
            id="messageSearch">

    </div>

</section>

<section class="stories">

    <div class="story">

        <div class="story-avatar add-story">

            +

        </div>

        <p>

            Your Story

        </p>

    </div>

    <div class="story">

        <div class="story-avatar online">

            Y

            <span class="online-dot"></span>

        </div>

        <p>

            Yashu

        </p>

    </div>

    <div class="story">

        <div class="story-avatar online">

            B

            <span class="online-dot"></span>

        </div>

        <p>

            Bot Pro

        </p>

    </div>

    <div class="story">

        <div class="story-avatar online">

            C

            <span class="online-dot"></span>

        </div>

        <p>

            Creator

        </p>

    </div>

</section>

<section class="chat-list">
    <!-- Chat 1 -->

    <div class="chat-item">

        <div class="chat-avatar online">

            Y

            <span class="online-dot"></span>

        </div>

        <div class="chat-info">

            <h3>

                Yashu

            </h3>

            <p>

                Hi, How are you?

            </p>

        </div>

        <div class="chat-right">

            <span class="chat-time">

                2m

            </span>

            <span class="unread">

                2

            </span>

        </div>

    </div>

    <!-- Chat 2 -->

    <div class="chat-item">

        <div class="chat-avatar online">

            B

            <span class="online-dot"></span>

        </div>

        <div class="chat-info">

            <h3>

                Bot Pro Team

            </h3>

            <p>

                Welcome to Bot Pro 🚀

            </p>

        </div>

        <div class="chat-right">

            <span class="chat-time">

                5m

            </span>

            <span class="unread">

                3

            </span>

        </div>

    </div>

    <!-- Chat 3 -->

    <div class="chat-item">

        <div class="chat-avatar online">

            C

            <span class="online-dot"></span>

        </div>

        <div class="chat-info">

            <h3>

                Creator

            </h3>

            <p>

                Check out this video.

            </p>

        </div>

        <div class="chat-right">

            <span class="chat-time">

                1h

            </span>

        </div>

    </div>

    <!-- Chat 4 -->

    <div class="chat-item">

        <div class="chat-avatar">

            T

        </div>

        <div class="chat-info">

            <h3>

                TechBot

            </h3>

            <p>

                Amazing Work!

            </p>

        </div>

        <div class="chat-right">

            <span class="chat-time">

                2h

            </span>

            <span class="unread">

                1

            </span>

        </div>

    </div>

    <!-- Chat 5 -->

    <div class="chat-item">

        <div class="chat-avatar">

            A

        </div>

        <div class="chat-info">

            <h3>

                Anjali

            </h3>

            <p>

                Let's catch up tomorrow.

            </p>

        </div>

        <div class="chat-right">

            <span class="chat-time">

                3h

            </span>

        </div>

    </div>

</section>

<nav class="bottom-nav">
    <a href="home.html">

        <svg class="nav-icon"
             viewBox="0 0 24 24">

            <path d="M3 11L12 3L21 11V21H14V14H10V21H3Z"
                  fill="currentColor"/>

        </svg>

        <span>

            Home

        </span>

    </a>

    <a href="message.html"
       class="active">

        <svg class="nav-icon"
             viewBox="0 0 24 24">

            <path d="M4 12L20 4L16 20L11 13L4 12Z"
                  fill="currentColor"/>

        </svg>

        <span>

            Messages

        </span>

    </a>

    <a href="reels.html">

        <svg class="nav-icon"
             viewBox="0 0 24 24">

            <path d="M8 5H18V19H8V5ZM4 5H7V9H4V5ZM4 10H7V14H4V10ZM4 15H7V19H4V15Z"
                  fill="currentColor"/>

        </svg>

        <span>

            Reels

        </span>

    </a>

    <a href="profile.html">

        <svg class="nav-icon"
             viewBox="0 0 24 24">

            <path d="M12 12A5 5 0 1 0 12 2A5 5 0 0 0 12 12ZM4 21C4 17.7 7.1 15 12 15C16.9 15 20 17.7 20 21Z"
                  fill="currentColor"/>

        </svg>

        <span>

            Profile

        </span>

    </a>

</nav>

<script type="module"
        src="../js/message.js"></script>

</body>

</html>
