<!-- =========================================
     Bot Pro Messages
     Chat Screen Ready
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Bot Pro - Messages
    </title>

    <link
        rel="stylesheet"
        href="../css/message.css">

</head>


<body>


<!-- =========================================
     MESSAGE LIST PAGE
========================================= -->

<div
    id="messagePage"
    class="message-page">


    <!-- HEADER -->

    <header class="header">


        <button
            type="button"
            class="menu-btn">

            ☰

        </button>


        <h1>
            Messages
        </h1>


        <div class="header-right">


            <button
                type="button"
                class="header-btn"
                id="newChatBtn">

                +

            </button>


        </div>

    </header>


    <!-- SEARCH -->

    <section class="search-section">

        <div class="search-box">


            <svg
                class="search-icon"
                viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"/>

                <path
                    d="M16 16L21 21"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>


            <input
                id="messageSearch"
                type="search"
                placeholder="Search messages...">

        </div>

    </section>


    <!-- STORIES -->

    <section class="stories">


        <div class="story">

            <div class="story-avatar add-story">
                +
            </div>

            <p>
                Your Story
            </p>

        </div>


        <div class="story">

            <div class="story-avatar">
                Y

                <span
                    class="online-dot">
                </span>

            </div>

            <p>
                Yashu
            </p>

        </div>


        <div class="story">

            <div class="story-avatar">
                B

                <span
                    class="online-dot">
                </span>

            </div>

            <p>
                Bot Pro
            </p>

        </div>


        <div class="story">

            <div class="story-avatar">
                C
            </div>

            <p>
                Creator
            </p>

        </div>


    </section>


    <!-- CHAT LIST -->

    <section
        class="chat-list"
        id="chatList">


        <!-- CHAT 1 -->

        <div
            class="chat-item"
            data-chat="Yashu">


            <div class="chat-avatar online">

                Y

                <span
                    class="online-dot">
                </span>

            </div>


            <div class="chat-info">

                <h3>
                    Yashu
                </h3>

                <p>
                    Hey! Welcome to Bot Pro 👋
                </p>

            </div>


            <div class="chat-right">

                <span class="chat-time">
                    9:20 PM
                </span>

                <span class="unread">
                    2
                </span>

            </div>

        </div>


        <!-- CHAT 2 -->

        <div
            class="chat-item"
            data-chat="Bot Pro">


            <div class="chat-avatar">

                B

            </div>


            <div class="chat-info">

                <h3>
                    Bot Pro
                </h3>

                <p>
                    Your upload was successful.
                </p>

            </div>


            <div class="chat-right">

                <span class="chat-time">
                    8:45 PM
                </span>

                <span class="unread">
                    1
                </span>

            </div>

        </div>


        <!-- CHAT 3 -->

        <div
            class="chat-item"
            data-chat="Creator">


            <div class="chat-avatar">

                C

            </div>


            <div class="chat-info">

                <h3>
                    Creator
                </h3>

                <p>
                    New content is ready.
                </p>

            </div>


            <div class="chat-right">

                <span class="chat-time">
                    Yesterday
                </span>

            </div>

        </div>


    </section>


</div>


<!-- =========================================
     CHAT SCREEN
========================================= -->

<div
    id="chatScreen"
    class="chat-screen"
    style="display:none;">


    <!-- CHAT HEADER -->

    <header class="chat-header">


        <button
            type="button"
            class="chat-back-btn"
            id="chatBackBtn">

            ←

        </button>


        <div
            class="chat-user">


            <div
                class="chat-user-avatar"
                id="chatUserAvatar">

                Y

            </div>


            <div>

                <h3
                    id="chatUserName">

                    Yashu

                </h3>


                <p
                    id="chatUserStatus">

                    Online

                </p>

            </div>

        </div>


        <button
            type="button"
            class="chat-menu-btn">

            ⋮

        </button>


    </header>


    <!-- CHAT MESSAGES -->

    <main
        class="chat-messages"
        id="chatMessages">


        <div class="chat-date">
            Today
        </div>


        <div class="message-row received">

            <div class="message-bubble">

                Hey! 👋

            </div>

        </div>


        <div class="message-row received">

            <div class="message-bubble">

                Welcome to Bot Pro.

            </div>

        </div>


        <div class="message-row sent">

            <div class="message-bubble">

                Thanks! 👍

            </div>

        </div>


    </main>


    <!-- CHAT INPUT -->

    <footer class="chat-input-area">


        <button
            type="button"
            class="chat-attach-btn">

            +

        </button>


        <input
            type="text"
            id="chatInput"
            placeholder="Write a message...">


        <button
            type="button"
            class="chat-send-btn"
            id="chatSendBtn">

            ➤

        </button>


    </footer>


</div>


<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">


    <a href="home.html">

        <span>
            🏠
        </span>

        <span>
            Home
        </span>

    </a>


    <a
        href="message.html"
        class="active">

        <span>
            💬
        </span>

        <span>
            Messages
        </span>

    </a>


    <a href="reels.html">

        <span>
            ▶
        </span>

        <span>
            Reels
        </span>

    </a>


    <a href="profile.html">

        <span>
            👤
        </span>

        <span>
            Profile
        </span>

    </a>


</nav>


<script
    src="../js/message.js">
</script>


</body>

</html>
