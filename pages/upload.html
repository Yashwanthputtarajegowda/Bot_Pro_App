<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Bot Pro - Upload
    </title>

    <title>

        <link
    rel="stylesheet"
    href="css/app-scale.css">

</head>


<body>


<div class="upload-page">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="upload-header">

        <button
            type="button"
            class="back-btn">

            <svg
                class="header-icon"
                viewBox="0 0 24 24">

                <path
                    d="M15 18L9 12L15 6"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

        </button>


        <h2>
            Upload
        </h2>


        <!-- UPLOAD SETTINGS BUTTON -->

        <button
            type="button"
            class="demo-btn"
            id="uploadSettingsBtn">

            ⚙ Upload Settings

        </button>

    </header>


    <!-- ==========================================
         UPLOAD SETTINGS
    ========================================== -->

    <section
        class="upload-settings"
        id="uploadSettingsPanel"
        style="display:none;">

        <div class="settings-header">

            <div>

                <h3>
                    Upload Settings
                </h3>

                <p>
                    Manage your upload preferences
                </p>

            </div>


            <button
                type="button"
                class="settings-close"
                id="uploadSettingsClose">

                ×

            </button>

        </div>


        <div class="settings-list">


            <!-- QUALITY -->

            <div class="setting-item">

                <div class="setting-info">

                    <strong>
                        Upload Quality
                    </strong>

                    <span>
                        Choose your preferred quality
                    </span>

                </div>


                <select id="uploadQuality">

                    <option value="auto">
                        Auto
                    </option>

                    <option value="1080">
                        1080p
                    </option>

                    <option value="720">
                        720p
                    </option>

                    <option value="480">
                        480p
                    </option>

                </select>

            </div>


            <!-- PRIVACY -->

            <div class="setting-item">

                <div class="setting-info">

                    <strong>
                        Default Privacy
                    </strong>

                    <span>
                        Privacy for new uploads
                    </span>

                </div>


                <select id="defaultPrivacy">

                    <option value="public">
                        Public
                    </option>

                    <option value="private">
                        Private
                    </option>

                    <option value="followers">
                        Followers Only
                    </option>

                </select>

            </div>


            <!-- COMMENTS -->

            <div class="setting-item">

                <div class="setting-info">

                    <strong>
                        Comments
                    </strong>

                    <span>
                        Allow comments on uploads
                    </span>

                </div>


                <select id="defaultComments">

                    <option value="allow">
                        Allow
                    </option>

                    <option value="disable">
                        Disable
                    </option>

                </select>

            </div>


            <!-- CUSTOM THUMBNAIL -->

            <div class="setting-item">

                <div class="setting-info">

                    <strong>
                        Custom Thumbnail
                    </strong>

                    <span>
                        Use custom thumbnail when available
                    </span>

                </div>


                <label class="setting-switch">

                    <input
                        type="checkbox"
                        id="customThumbnailSetting"
                        checked>

                    <span class="switch-slider"></span>

                </label>

            </div>


            <!-- SAVE -->

            <button
                type="button"
                class="save-settings-btn"
                id="saveUploadSettings">

                Save Settings

            </button>


        </div>

    </section>


    <!-- ==========================================
         UPLOAD TYPE
    ========================================== -->

    <section class="upload-type">

        <h3>
            Choose Upload Type
        </h3>


        <div class="type-grid">


            <!-- VIDEO -->

            <button class="type-card active">

                <svg
                    class="type-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M8 5H18V19H8V5ZM4 5H7V9H4V5ZM4 10H7V14H4V10ZM4 15H7V19H4V15"
                        fill="currentColor"/>

                </svg>


                <span>
                    Video
                </span>

            </button>


            <!-- REEL -->

            <button class="type-card">

                <svg
                    class="type-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M5 4L19 12L5 20V4Z"
                        fill="currentColor"/>

                </svg>


                <span>
                    Reel
                </span>

            </button>


            <!-- LINK -->

            <button class="type-card">

                <svg
                    class="type-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M10 14L14 10M8 16L6 18C4.9 19.1 3.1 19.1 2 18C0.9 16.9 0.9 15.1 2 14L6 10M16 8L18 6C19.1 4.9 20.9 4.9 22 6C23.1 7.1 23.1 8.9 22 10L18 14"
                        stroke="currentColor"
                        stroke-width="2"
                        fill="none"/>

                </svg>


                <span>
                    Link
                </span>

            </button>


        </div>

    </section>


    <!-- ==========================================
         UPLOAD BOX
    ========================================== -->

    <section class="upload-box">


        <div
            class="upload-select"
            id="videoUploadBox">


            <!-- CLOSE VIDEO -->

            <button
                type="button"
                class="preview-close"
                id="videoCancelBtn"
                style="display:none;">

                ×

            </button>


            <!-- CHOOSE VIDEO -->

            <div id="videoChooseArea">

                <svg
                    class="upload-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M12 3V16M7 8L12 3L17 8M5 20H19"
                        stroke="currentColor"
                        stroke-width="2.4"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                </svg>


                <h3>
                    Select Video
                </h3>


                <p>
                    MP4 • MOV • AVI • Max 2GB
                </p>


                <button
                    type="button"
                    class="select-btn">

                    Choose File

                </button>

            </div>


            <!-- VIDEO PREVIEW -->

            <div
                id="videoPreviewArea"
                class="video-preview-area"
                style="display:none;">

                <video
                    id="videoPreview"
                    controls
                    playsinline>
                </video>


                <div
                    id="videoFileName"
                    class="video-file-name">
                </div>

            </div>


        </div>


        <!-- ==========================================
             THUMBNAIL
        ========================================== -->

        <div class="thumbnail-section">

            <h3>
                Thumbnail
            </h3>


            <div class="thumbnail-row">


                <!-- THUMBNAIL PREVIEW -->

                <div
                    class="thumb-preview"
                    id="thumbnailPreview">


                    <span id="thumbnailText">
                        No Thumbnail
                    </span>


                    <img
                        id="thumbnailImage"
                        alt="Thumbnail"
                        style="display:none;">


                    <button
                        type="button"
                        class="thumbnail-close"
                        id="thumbnailCancelBtn"
                        style="display:none;">

                        ×

                    </button>


                </div>


                <!-- THUMBNAIL BUTTON -->

                <button
                    type="button"
                    class="thumb-upload">

                    Choose Thumbnail

                </button>


            </div>

        </div>


    </section>


    <!-- ==========================================
         DETAILS
    ========================================== -->

    <section class="details-section">

        <h3>
            Video Details
        </h3>


        <input
            type="text"
            class="title-input"
            placeholder="Enter title">


        <textarea
            class="description-input"
            placeholder="Write description..."></textarea>

    </section>


    <!-- ==========================================
         CATEGORY
    ========================================== -->

    <section class="category-section">

        <h3>
            Category
        </h3>


        <select class="category-select">

            <option>
                Select Category
            </option>

            <option>
                Gaming
            </option>

            <option>
                Technology
            </option>

            <option>
                Education
            </option>

            <option>
                Music
            </option>

            <option>
                Movies
            </option>

            <option>
                AI
            </option>

            <option>
                Entertainment
            </option>

            <option>
                Sports
            </option>

            <option>
                Other
            </option>

        </select>

    </section>


    <!-- ==========================================
         PRIVACY
    ========================================== -->

    <section class="privacy-section">


        <div class="option-box">

            <label>
                Privacy
            </label>


            <select>

                <option>
                    Public
                </option>

                <option>
                    Private
                </option>

                <option>
                    Followers Only
                </option>

            </select>

        </div>


        <div class="option-box">

            <label>
                Comments
            </label>


            <select>

                <option>
                    Allow
                </option>

                <option>
                    Disable
                </option>

            </select>

        </div>


    </section>


    <!-- ==========================================
         LINK
    ========================================== -->

    <section class="link-section">

        <h3>
            External Link (Optional)
        </h3>


        <input
            type="url"
            class="link-input"
            placeholder="Paste YouTube, Website or Any URL">

    </section>


    <!-- ==========================================
         TAGS
    ========================================== -->

    <section class="tags-section">

        <h3>
            Tags
        </h3>


        <input
            type="text"
            class="tags-input"
            placeholder="#technology #gaming #botpro">

    </section>


    <!-- ==========================================
         UPLOAD STATUS
    ========================================== -->

    <section class="upload-status">

        <div class="progress-header">

            <span>
                Upload Progress
            </span>

            <span id="progressText">
                0%
            </span>

        </div>


        <div class="progress-bar">

            <div class="progress-fill"></div>

        </div>

    </section>


    <!-- ==========================================
         UPLOAD BUTTON
    ========================================== -->

    <section class="upload-action">

        <button class="upload-btn">
            Upload Now
        </button>

    </section>


    <!-- ==========================================
         RULES
    ========================================== -->

    <section class="upload-rules">

        <h3>
            Upload Rules
        </h3>


        <ul>

            <li>
                Upload only original content.
            </li>

            <li>
                Do not upload copyrighted videos.
            </li>

            <li>
                Community Guidelines must be followed.
            </li>

        </ul>

    </section>


</div>


<!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->

    <a href="home.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M3 11L12 3L21 11V21H14V14H10V21H3Z"
                fill="currentColor"/>

        </svg>

        <span>
            Home
        </span>

    </a>


    <a href="message.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M4 12L20 4L16 20L11 13L4 12Z"
                fill="currentColor"/>

        </svg>

        <span>
            Messages
        </span>

    </a>


    <a href="reels.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M8 5H18V19H8V5ZM4 5H7V9H4V5ZM4 10H7V14H4V10ZM4 15H7V19H4V15Z"
                fill="currentColor"/>

        </svg>

        <span>
            Reels
        </span>

    </a>


    <a href="profile.html">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24">

            <path
                d="M12 12A5 5 0 1 0 12 2A5 5 0 0 0 12 12ZM4 21C4 17.7 7.1 15 12 15C16.9 15 20 17.7 20 21Z"
                fill="currentColor"/>

        </svg>

        <span>
            Profile
        </span>

    </a>


</nav>


<script
    type="module"
    src="../js/upload.js">
</script>


</body>

</html>
