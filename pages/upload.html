<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOT PRO - Upload</title>

    <link rel="stylesheet" href="../css/upload.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

    <header class="top-bar">

        <button id="backBtn" class="back-btn">

            <span class="material-icons">arrow_back</span>

        </button>

        <div class="logo">

            <span class="bot">BOT</span>

            <span class="pro">PRO</span>

        </div>

    </header>

    <main class="upload-page">

        <h2>Upload Content</h2>

        <div class="tab-bar">

            <button class="tab active" id="videoTab">

                🎥 Video

            </button>

            <button class="tab" id="reelTab">

                🎬 Reel

            </button>

            <button class="tab" id="linkTab">

                🔗 Link

            </button>

        </div>

        <!-- VIDEO SECTION -->

        <section id="videoSection" class="upload-section">

            <div class="upload-card">

                <label>

                    Thumbnail

                </label>

                <input
                    type="file"
                    id="thumbnail"
                    accept="image/*">

                <div id="thumbnailPreview"></div>

            </div>

            <div class="upload-card">

                <label>

                    Video File

                </label>

                <input
                    type="file"
                    id="video"
                    accept="video/*">

                <div id="videoPreview"></div>

            </div>

            <div class="input-box">

                <input
                    type="text"
                    id="title"
                    placeholder="Video Title">

            </div>

            <div class="input-box">

                <textarea
                    id="description"
                    placeholder="Video Description"></textarea>

            </div>

            <div class="input-box">

                <select id="category">

                    <option>For You</option>

                    <option>Trending</option>

                    <option>Gaming</option>

                    <option>Movies</option>

                    <option>Music</option>

                    <option>AI</option>

                    <option>News</option>

                    <option>Sports</option>

                </select>

            </div>
