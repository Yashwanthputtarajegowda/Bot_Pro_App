<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOT PRO - Upload</title>

<link rel="stylesheet" href="../css/upload.css">

</head>

<body>

<header class="top-bar">

<button id="backBtn" class="back-btn">
←
</button>

<div class="logo">

<span class="bot">BOT</span>

<span class="pro">PRO</span>

</div>

<div class="header-right"></div>

</header>

<main class="upload-page">

<h2>Upload Content</h2>

<div class="tab-bar">

<button id="videoTab" class="tab active">

🎥 Video

</button>

<button id="reelTab" class="tab">

🎬 Reel

</button>

<button id="linkTab" class="tab">

🔗 Link

</button>

</div>

<!-- VIDEO -->

<section id="videoSection" class="upload-section">

<div class="upload-card">

<label>

Thumbnail

</label>

<input
type="file"
id="thumbnail"
accept="image/*">

<div id="thumbnailPreview"></div>

</div>

<div class="upload-card">

<label>

Video File

</label>

<input
type="file"
id="video"
accept="video/*">

<div id="videoPreview"></div>

</div>

<div class="input-box">

<input
type="text"
id="title"
placeholder="Video Title">

</div>

<div class="input-box">

<textarea
id="description"
placeholder="Video Description"></textarea>

</div>

<div class="input-box">

<select id="category">

<option>For You</option>

<option>Trending</option>

<option>Gaming</option>

<option>Movies</option>

<option>Music</option>

<option>AI</option>

<option>News</option>

<option>Sports</option>

</select>

</div>

<div class="input-box">

<input
type="text"
id="tags"
placeholder="Tags">

</div>

<div class="input-box">

<select id="visibility">

<option>Public</option>

<option>Followers Only</option>

<option>Private</option>

</select>

</div>

<div class="action-buttons">

<button
id="aiVideoBtn"
class="secondary-btn">

🤖 AI Generate

</button>

<button
id="uploadBtn"
class="primary-btn">

Upload Video

</button>

</div>

</section>
<!-- REEL SECTION -->

<section id="reelSection" class="upload-section hidden">

<div class="upload-card">

<label>

Cover Image

</label>

<input
type="file"
id="reelCover"
accept="image/*">

<div id="coverPreview"></div>

</div>

<div class="upload-card">

<label>

Reel Video

</label>

<input
type="file"
id="reelVideo"
accept="video/*">

<div id="reelPreview"></div>

</div>

<div class="input-box">

<input
type="text"
id="reelTitle"
placeholder="Reel Title">

</div>

<div class="input-box">

<textarea
id="reelCaption"
placeholder="Write Caption"></textarea>

</div>

<div class="input-box">

<select id="reelCategory">

<option>Entertainment</option>

<option>Gaming</option>

<option>Music</option>

<option>Comedy</option>

<option>Education</option>

<option>Technology</option>

</select>

</div>

<div class="input-box">

<select id="reelVisibility">

<option>Public</option>

<option>Followers Only</option>

<option>Private</option>

</select>

</div>

<div class="action-buttons">

<button
id="aiReelBtn"
class="secondary-btn">

🤖 AI Caption

</button>

<button
id="uploadReelBtn"
class="primary-btn">

Upload Reel

</button>

</div>

</section>

<!-- LINK SECTION -->

<section id="linkSection" class="upload-section hidden">

<div class="input-box">

<input
type="url"
id="videoLink"
placeholder="Paste Video Link">

</div>

<div class="input-box">

<input
type="text"
id="linkTitle"
placeholder="Title (Optional)">

</div>

<div class="input-box">

<textarea
id="linkDescription"
placeholder="Description"></textarea>

</div>

<div class="input-box">

<select id="linkCategory">

<option>For You</option>

<option>Trending</option>

<option>Gaming</option>

<option>Movies</option>

<option>Music</option>

<option>AI</option>

<option>News</option>

<option>Sports</option>

</select>

</div>

<div class="action-buttons">

<button
id="fetchLinkBtn"
class="secondary-btn">

🔍 Fetch Details

</button>

<button
id="uploadLinkBtn"
class="primary-btn">

Import Link

</button>

</div>

</section>
<!-- UPLOAD PROGRESS -->

<div class="progress-area">

    <div class="progress-bar">

        <div id="progressFill"></div>

    </div>

    <p id="progressText">

        Waiting for upload...

    </p>

</div>

<div id="status"></div>

</main>

<script src="../js/upload.js"></script>

</body>

</html>
