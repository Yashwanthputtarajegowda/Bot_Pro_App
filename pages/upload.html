<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOT PRO - Upload</title>

    <link rel="stylesheet" href="../css/upload.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

</head>

<body>

<div class="container">

<div class="logo">

<span class="bot">BOT</span>

<span class="pro">PRO</span>

</div>

<h2>Upload Content</h2>

<div class="upload-type">

<button class="type-btn active" id="videoTab">

🎥 Video

</button>

<button class="type-btn" id="reelTab">

🎬 Reel

</button>

<button class="type-btn" id="linkTab">

🔗 Link

</button>

</div>

<div id="videoSection">

<div class="input-box">

<input
type="file"
id="thumbnail"
accept="image/*">

</div>

<div class="input-box">

<input
type="file"
id="video"
accept="video/*">

</div>

<div class="input-box">

<input
type="text"
id="title"
placeholder="Video Title">

</div>

<div class="input-box">

<textarea
id="description"
placeholder="Video Description"></textarea>

</div>

<div class="input-box">

<select id="category">

<option>For You</option>

<option>Trending</option>

<option>Gaming</option>

<option>Movies</option>

<option>Music</option>

<option>AI</option>

<option>News</option>

<option>Sports</option>

</select>

</div>

<div class="input-box">

<select id="visibility">

<option>Public</option>

<option>Private</option>

<option>Followers Only</option>

</select>

</div>

<button
id="uploadBtn"
class="upload-btn">

Upload Video

</button>

</div>

<div id="status"></div>

</div>

<script src="../js/upload.js"></script>

</body>

</html>
