<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOT PRO - Upload</title>

<link rel="stylesheet" href="../css/upload.css">

</head>

<body>

<header class="top-bar">

<button id="backBtn" class="back-btn">
←
</button>

<div class="logo">

<span class="bot">BOT</span>

<span class="pro">PRO</span>

</div>

<div class="header-right"></div>

</header>

<main class="upload-page">

<h2>Upload Content</h2>

<div class="tab-bar">

<button id="videoTab" class="tab active">

🎥 Video

</button>

<button id="reelTab" class="tab">

🎬 Reel

</button>

<button id="linkTab" class="tab">

🔗 Link

</button>

</div>

<!-- VIDEO -->

<section id="videoSection" class="upload-section">

<div class="upload-card">

<label>

Thumbnail

</label>

<input
type="file"
id="thumbnail"
accept="image/*">

<div id="thumbnailPreview"></div>

</div>

<div class="upload-card">

<label>

Video File

</label>

<input
type="file"
id="video"
accept="video/*">

<div id="videoPreview"></div>

</div>

<div class="input-box">

<input
type="text"
id="title"
placeholder="Video Title">

</div>

<div class="input-box">

<textarea
id="description"
placeholder="Video Description"></textarea>

</div>

<div class="input-box">

<select id="category">

<option>For You</option>

<option>Trending</option>

<option>Gaming</option>

<option>Movies</option>

<option>Music</option>

<option>AI</option>

<option>News</option>

<option>Sports</option>

</select>

</div>

<div class="input-box">

<input
type="text"
id="tags"
placeholder="Tags">

</div>

<div class="input-box">

<select id="visibility">

<option>Public</option>

<option>Followers Only</option>

<option>Private</option>

</select>

</div>

<div class="action-buttons">

<button
id="aiVideoBtn"
class="secondary-btn">

🤖 AI Generate

</button>

<button
id="uploadBtn"
class="primary-btn">

Upload Video

</button>

</div>

</section>
