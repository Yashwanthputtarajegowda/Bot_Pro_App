<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bot Pro - Register</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="login-container">

<h1 class="login-logo">
BOT PRO
</h1>

<p>Create New Account</p>

<input
id="fullName"
type="text"
placeholder="Full Name">

<input
id="username"
type="text"
placeholder="Username">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password">

<button id="registerBtn">
Create Account
</button>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<!-- Firebase Register -->

<script type="module" src="../firebase/register.js"></script>

</body>

</html>
