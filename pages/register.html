<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOT PRO - Register</title>

    <title>

        <link
    rel="stylesheet"
    href="css/app-scale.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- Logo -->

        <div class="logo">

            <span class="bot">BOT</span>

            <span class="pro">PRO</span>

        </div>

        <h2>Create New Account</h2>

        <!-- Register Form -->

        <form id="registerForm">

            <div class="input-box">

                <span class="material-icons">person</span>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="input-box">

                <span class="material-icons">alternate_email</span>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>

            </div>

            <div class="input-box">

                <span class="material-icons">email</span>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="input-box">

                <span class="material-icons">lock</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>

            <div class="input-box">

                <span class="material-icons">lock</span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

            </div>

            <button
                type="button"
                id="registerBtn"
                class="register-btn">

                Create Account

            </button>

        </form>

        <div class="register">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </div>

    </div>

    <script type="module" src="../firebase/register.js"></script>

</body>

</html>
