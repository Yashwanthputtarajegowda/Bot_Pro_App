<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOT PRO - Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- Logo -->

        <div class="logo">

            <span class="bot">BOT</span>

            <span class="pro">PRO</span>

        </div>

        <h2>Welcome Back</h2>

        <!-- Login Form -->

        <form id="loginForm">

            <!-- Email -->

            <div class="input-box">

                <span class="material-icons">

                    email

                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <span class="material-icons">

                    lock

                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <span
                    class="material-icons eye"
                    id="togglePassword">

                    visibility

                </span>

            </div>

            <!-- Login Button -->

            <button
                type="button"
                id="loginBtn"
                class="login-btn">

                Login

            </button>

        </form>

        <!-- Register -->

        <div class="register">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </div>

    </div>

    <script type="module" src="../firebase/login.js"></script>

</body>

</html>
